name: table-hub

services:
  db:
    image: paradedb/paradedb:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: table_hub
      POSTGRES_USER: tablehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablehub -d table_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASYNC_DATABASE_URL: postgresql+asyncpg://tablehub:${POSTGRES_PASSWORD}@db:5432/table_hub
      CHECKPOINT_DATABASE_URL: postgresql://tablehub:${POSTGRES_PASSWORD}@db:5432/table_hub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ../../table-hub-web
      args:
        API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
      INTERNAL_API_BASE_URL: http://api:8000
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
